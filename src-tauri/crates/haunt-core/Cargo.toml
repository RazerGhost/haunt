# Haunt's git, code reading and scan, with no Tauri in it: tested and usable on their own. The app (src-tauri) is built
# on it.
[package]
name = "haunt-core"
version.workspace = true
description = "Haunt's git, code reading and scan, without the app"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix = "=0.90.0"
# Locks that stay usable after a panic in another thread (std's are poisoned for good).
parking_lot = "=0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tree-sitter = "=0.27.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-lua = "=0.5.0"
tree-sitter-php = "=0.25.1"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tempfile = { version = "3.27.0", optional = true }

[features]
# What the app's tests use of core's: the repository the tests build (git::testing) and git::web_page.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3.27.0"
