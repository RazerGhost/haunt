# Runs the checks of docs/development.md on every push to main and every pull request, on Linux, Windows and macOS:
# git and paths behave differently on each. On Linux it also checks that app/bindings.ts is the one the commands
# write, so a changed command cannot reach the window with old types.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The files as they are in the repository, with LF, also on Windows: the bindings and the tests' fixtures are
      # compared as text.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # pnpm's version from package.json (`packageManager`); Node 22's latest, which is 22.18 or later.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Its own lockfile, outside any pnpm workspace it may be checked out in.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # The TypeScript the app ships (src-tauri/bundled), which the app's build wants present; a build makes it
      # before it starts (tauri.conf.json's beforeBuildCommand).
      - run: node scripts/bundle-typescript.mjs

      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:rust

      # The Rust tests write app/bindings.ts from the commands (`writes_the_windows_bindings`); written again here on
      # its own, it must be the file checked in.
      - name: Bindings are up to date
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib writes_the_windows_bindings
          git diff --exit-code app/bindings.ts
